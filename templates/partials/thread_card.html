<div>
    <h2>{{ email.subject }}</h2>

    <p>
        <strong>From:</strong>
        {{ email.sender }}
    </p>

    <p>
        <strong>Snippet:</strong>
        {{ email.snippet }}
    </p>

    <p>
        <strong>Priority:</strong>
        {{ email.priority }}
    </p>

    <p>
        <strong>Status:</strong>
        {{ email.status }}
    </p>

    <p>
        <strong>Reason:</strong>
        {{ email.reason }}
    </p>

    <p>
        <a
            href="{{ email.gmail_url }}"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open in Gmail
        </a>
    </p>

    <form
    action="{{ url_for('update_status', email_id=email.id) }}"
    method="POST"
    >
        <label for="status-{{ email.id }}">
            Change status:
        </label>

        <select
            id="status-{{ email.id }}"
            name="status"
        >
            <option
                value="Needs Reply"
                {% if email.status == "Needs Reply" %}selected{% endif %}
            >
                Needs Reply
            </option>

            <option
                value="Review"
                {% if email.status == "Review" %}selected{% endif %}
            >
                Review
            </option>

            <option
                value="Waiting"
                {% if email.status == "Waiting" %}selected{% endif %}
            >
                Waiting
            </option>

            <option
                value="Done"
                {% if email.status == "Done" %}selected{% endif %}
            >
                Done
            </option>

            <option
                value="No Action"
                {% if email.status == "No Action" %}selected{% endif %}
            >
                No Action
            </option>
        </select>

        <button type="submit">
            Update
        </button>
    </form>

    <hr>
</div>
