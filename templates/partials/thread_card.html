<article
    class="thread-card"
    data-thread-card
    data-thread-id="{{ email.id }}"
    tabindex="0"
    role="button"
    aria-label="View details for {{ email.subject }}"
>
    <div class="thread-card__content">
        <p>{{ email.sender }}</p>

        <h2>
            {{ email.subject or "(No subject)" }}
        </h2>

        <p>{{ email.snippet }}</p>

        <p>
            Status:
            <span data-thread-status>
                {{ email.status }}
            </span>
        </p>

        <p>Priority: {{ email.priority }}</p>
    </div>

    <div class="thread-card__actions">
        <button
            type="button"
            data-open-thread
        >
            View details
        </button>

        <form
        action="{{ url_for('update_status', email_id=email.id) }}"
        method="POST"
        >
            <label for="status-{{ email.id }}">
                Change status:
            </label>
    
            <select
                id="status-{{ email.id }}"
                name="status"
            >
                <option
                    value="Needs Reply"
                    {% if email.status == "Needs Reply" %}selected{% endif %}
                >
                    Needs Reply
                </option>
    
                <option
                    value="Review"
                    {% if email.status == "Review" %}selected{% endif %}
                >
                    Review
                </option>
    
                <option
                    value="Waiting"
                    {% if email.status == "Waiting" %}selected{% endif %}
                >
                    Waiting
                </option>
    
                <option
                    value="Done"
                    {% if email.status == "Done" %}selected{% endif %}
                >
                    Done
                </option>
    
                <option
                    value="No Action"
                    {% if email.status == "No Action" %}selected{% endif %}
                >
                    No Action
                </option>
            </select>
    
            <button type="submit">
                Update
            </button>
        </form>

        <a
            href="{{ email.gmail_url }}"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open in Gmail
        </a>
    </div>
</article>
<hr>
